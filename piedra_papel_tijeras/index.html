<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                   initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Rock Paper Scissor</title>
</head>
<body>
    <section class="game">
        <!--Title -->
        <div class="title">Piedra, Papel o Tijera</div>
        
          <!--Display Score of player and computer -->
        <div class="score">  
            <div class="playerScore">
                <h2>Tu</h2>
                <p class="p-count count">0</p>

            </div>       
            <div class="computerScore">
                <h2>Maquina</h2>
                <p class="c-count count">0</p>

            </div>
        </div>
      
        <div class="move">Elige tu movimiento</div>
        
          <!--Number of moves left before game ends -->
        <div class="movesleft">movimientos restantes: 10 </div>
        
          <!--Options available to player to play game -->
        <div class="options">
          <button class="rock" data-choice="rock">Piedra</button>
          <button class="paper" data-choice="paper">Papel</button>
          <button class="scissor" data-choice="scissors">Tijeras</button>
        </div>
        
          <!--Final result of game -->
        <div class="result"></div>
        
          <!--Reload the game -->
        <button class="reload"></button>

    </section>

    <script src="app.js"></script>
</body>
</html>
