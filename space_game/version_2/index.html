<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Rocket Defense</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <!-- Pantalla de inicio -->
        <div class="start-screen" id="startScreen">
            <div class="mini-rocket">◆</div>

            <p class="game-tag">MISSION CONTROL</p>

            <h1>SPACE INVADERS</h1>

            <h2>ROCKET DEFENSE</h2>

            <div class="decorative-line"></div>

            <div class="instructions">
                <p><strong>MOVIMIENTO</strong> ← →</p>
                <p><strong>DISPARAR</strong> ESPACIO</p>
                <p>Defiende el planeta de la invasión.</p>
            </div>

            <button id="startButton">INICIAR MISIÓN</button>

            <p class="version-text">ROCKET DEFENSE // VERSION 2</p>
        </div>

        <!-- Juego -->
        <div class="game-ui" id="gameUI" style="display: none;">

            <div class="hud">

                <div class="hud-item">
                    <span class="label">PUNTUACIÓN</span>
                    <span id="score" class="value">0</span>
                </div>

                <div class="hud-item">
                    <span class="label">NIVEL</span>
                    <span id="level" class="value">1</span>
                </div>

                <div class="hud-item">
                    <span class="label">VIDAS</span>
                    <span id="lives" class="value">3</span>
                </div>

            </div>

            <canvas id="gameCanvas" width="800" height="600"></canvas>

            <div class="controls">
                ← → MOVER &nbsp;&nbsp; | &nbsp;&nbsp; ESPACIO DISPARAR
            </div>

        </div>

        <!-- Pantalla final -->
        <div class="game-over-screen" id="gameOverScreen" style="display: none;">

            <p class="game-tag">MISSION CONTROL</p>

            <h1>FIN DE LA MISIÓN</h1>

            <div class="decorative-line"></div>

            <div id="finalMessage"></div>

            <div class="final-score">
                <span>PUNTUACIÓN FINAL</span>
                <strong id="finalScore">0</strong>
            </div>

            <button id="restartButton">VOLVER A INTENTAR</button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
